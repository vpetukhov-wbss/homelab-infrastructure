[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-pulse-agent"
version = "0.1.0"
description = "Linux telemetry agent for HomeLab Pulse"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pulse-agent = "pulse_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
