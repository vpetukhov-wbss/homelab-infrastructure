[agent]
ingest_url = http://pulse-api.example.invalid:8080/internal/v1/telemetry
state_directory = ./data/pulse-agent
timeout_seconds = 2
max_pending = 512
max_age_seconds = 86400
send_limit = 4
# Optional private NGINX stub_status endpoint.
# nginx_status_url = http://127.0.0.1:8081/stub_status

[filesystems]
root = /

[network]
# Map a public-safe alias to an interface in your private configuration.

[temperatures]
# Map an alias to the absolute path of a Linux hwmon temperature input.

[fans]
# Map an alias to an absolute hwmon fanN_input path readable by the agent.
# cpu = /sys/class/hwmon/hwmon0/fan1_input

[disks]
# Optional inventory aliases mapped to whole device names under /sys/block.
# system = nvme0n1
# archive = sda

[smart_snapshots]
# Map an approved disk alias to an absolute path containing normalized SMART JSON.
# system = /run/pulse-smart/system.json

[sqlite_databases]
# Map an approved alias to a local database path visible to the agent.
# history = /var/lib/example-app/history.db

[redis]
# Use an approved private IP and a dedicated Redis ACL account.
# host = 127.0.0.1
# port = 6379
# username = pulse-monitor
# For local testing outside systemd, set an absolute credential file path.
# password_file = /run/pulse-demo/redis-password

[postgresql]
# Select one approved database over loopback or the WireGuard overlay.
# host = 127.0.0.1
# port = 5432
# database = example
# username = pulse-monitor
# For local testing outside systemd, set a private libpq password file.
# pgpass_file = /run/pulse-demo/postgres-pgpass
