# The dashboard and the public API on one origin. Unprivileged and read-only except /tmp.
worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Docker's DNS, re-resolved, so a recreated receiver is found again.
        resolver 127.0.0.11 valid=10s;
        set $receiver http://receiver:8080;

        location /api/ {
            proxy_pass $receiver;
            proxy_set_header Host $host;
        }

        location /hubs/ {
            proxy_pass $receiver;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
        }

        # Ingest is private: never through the public origin.
        location /internal/ {
            return 404;
        }

        # The shell and the service worker must be revalidated; hashed files may be cached.
        location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js)$ {
            add_header Cache-Control no-cache;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
