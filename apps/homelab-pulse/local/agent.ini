# Demo agent of compose.yaml. Values describe the container's own view of the machine.
[agent]
ingest_url = http://receiver:8080/internal/v1/telemetry
state_directory = /var/lib/pulse-agent
timeout_seconds = 2
max_pending = 512
max_age_seconds = 86400
send_limit = 4

[filesystems]
root = /

[network]
lan = eth0
