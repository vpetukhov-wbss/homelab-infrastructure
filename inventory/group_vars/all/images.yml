---
# Every container image the platform runs, pinned to an exact version or digest.
# A floating tag lets a re-pull silently change what runs — on 2026-11-21 one Redis
# replication group was running three different 7.4.x builds under `redis:7-alpine`.
# Upgrade deliberately: change the pin here, run the owning playbook, verify.
image_postgres: "postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f"  # 16.16, Debian trixie
image_redis: "redis:7.4.12-alpine"
image_caddy: "caddy:2.11.9-alpine"
image_vault: "hashicorp/vault:1.18.5"
image_sftp: "atmoz/sftp:alpine@sha256:c5fb9e4beb8b7054a4c0b65c5e11df47cc20da95ad6002e88aecff62bab06372"  # no version tags upstream
rabbitmq_image: "rabbitmq:3.13.7-management-alpine"
app_nginx_image: "nginx:1.27.5-alpine"
gitea_image: "gitea/gitea:1.22.6"
gitea_runner_image: "gitea/act_runner:0.6.1"
mongodb_image: "mongo:8.0.38-noble"   # the 8.0 major-release line
