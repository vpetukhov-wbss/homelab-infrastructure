# The secret variables the roles expect — NAMES ONLY. This file is not loaded by Ansible.
#
# Do NOT copy this file into inventory/group_vars/: every file there is loaded, and a
# placeholder would silently override the real value. Create the encrypted files instead:
#
#   cd ansible
#   ~/homelab/.venv/bin/ansible-vault create ../inventory/group_vars/homelab/db_secrets.yml
#   ~/homelab/.venv/bin/ansible-vault create ../inventory/group_vars/homelab/vault.yml
#
# Both are git-ignored and opened with ~/.homelab_vault_pass (see ansible.cfg).
# Generate service passwords, e.g.: openssl rand -base64 32

# inventory/group_vars/homelab/db_secrets.yml
vault_pg_password: "<PostgreSQL superuser password>"
vault_pg_replicator_password: "<PostgreSQL replication role password>"
vault_redis_password: "<Redis and Sentinel password>"
vault_rabbitmq_password: "<RabbitMQ user password>"
vault_mongodb_root_password: "<MongoDB root password>"
vault_mongodb_backup_password: "<MongoDB backup account password>"
vault_backup_passphrase: "<passphrase that encrypts the nightly backup archives>"

# inventory/group_vars/homelab/vault.yml
ansible_become_pass: "<sudo password of ansible_user on the servers>"
