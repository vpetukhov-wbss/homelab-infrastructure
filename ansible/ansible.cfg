[defaults]
inventory = ../inventory/hosts.yml
# ON: the LAN is hostile and node1's address drifts, so an impostor taking a free IP
# would otherwise receive the become password and every rendered secret. Keys are
# pinned in ~/.ssh/known_hosts under the inventory name (HostKeyAlias in the inventory).
host_key_checking = True
interpreter_python = /usr/bin/python3
roles_path = roles
deprecation_warnings = False
vault_password_file = ~/.homelab_vault_pass

[privilege_escalation]
become = False
become_method = sudo
