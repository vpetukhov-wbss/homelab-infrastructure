---
# Base layer: Docker (node2 and node4; it was preinstalled on node1/node3), base packages everywhere.
# Run: ansible-playbook playbooks/base.yml  (become password from the git-ignored ansible-vault file)

- name: Install Docker where it was not preinstalled
  hosts: data_primary:controller
  gather_facts: true
  roles:
    - docker

- name: Install base packages + enable IP forwarding on the fleet
  hosts: edge:data_primary:data_replica:controller
  gather_facts: true
  roles:
    - base_packages
    - host_hardening

- name: The laptop's own - Wi-Fi without power saving, no LXD
  hosts: controller
  gather_facts: true
  roles:
    - wifi_power_save
    - lxd_disabled
