---
# Every layer, in dependency order. Each playbook is idempotent and can also be run on
# its own; this file only fixes the order. From ansible/:
#   ~/homelab/.venv/bin/ansible-playbook playbooks/site.yml
#
# Order constraints that matter on a machine built from scratch:
#   data-primary before data-replica (the standby is cloned from the primary);
#   sentinels after both (they monitor the live master);
#   edge before sftp-mirror (the mirror watches the edge's SFTP tree);
#   app-host and gitea before sftp-mirror (node3's exports snapshot their data);
#   backup last (it pulls those exports and dumps every service).
- name: Base packages, host hardening, Docker
  ansible.builtin.import_playbook: base.yml
- name: WireGuard overlay
  ansible.builtin.import_playbook: overlay.yml
- name: Firewall, overlay guard, SSH hardening
  ansible.builtin.import_playbook: security.yml
- name: Fail2Ban
  ansible.builtin.import_playbook: fail2ban.yml
- name: PostgreSQL primary and Redis
  ansible.builtin.import_playbook: data-primary.yml
- name: PostgreSQL standby and Redis
  ansible.builtin.import_playbook: data-replica.yml
- name: Redis Sentinels
  ansible.builtin.import_playbook: sentinels.yml
- name: Edge
  ansible.builtin.import_playbook: edge.yml
- name: Application host
  ansible.builtin.import_playbook: app-host.yml
- name: RabbitMQ
  ansible.builtin.import_playbook: rabbitmq.yml
- name: Gitea and the Actions runner
  ansible.builtin.import_playbook: gitea.yml
- name: SFTP mirror and node3 exports
  ansible.builtin.import_playbook: sftp-mirror.yml
- name: Nightly backup
  ansible.builtin.import_playbook: backup.yml
