---
# Redis roles are discovered from the live Sentinels first, never assumed from the
# inventory: a failover moves the master, and seeding from the inventory would revert it.
- name: Discover the current Redis master
  hosts: edge:data_primary:data_replica
  gather_facts: false
  roles:
    - redis_topology

# node2: Postgres PRIMARY + Redis PRIMARY. Requires WG overlay up first.
- name: Data-primary stack (node2)
  hosts: data_primary
  gather_facts: true
  vars:
    stack_dir: "/home/{{ ansible_user }}/stacks/data-primary"
  roles:
    - postgres_primary
