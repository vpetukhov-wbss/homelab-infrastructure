---
# ufw: default-deny, allow only SSH + WireGuard + overlay; edge also allows 80/443.
# CRITICAL: SSH + WG allow rules are added BEFORE enabling ufw, so we never lock out.
# DB ports are NOT opened here. Containers publish them on the wg1 overlay IP, but that
# alone does NOT keep them off the LAN (Docker DNAT bypasses ufw) — the overlay guard
# at the end of this file is what does. See defaults/main.yml.

- name: Read the port sshd actually uses
  ansible.builtin.command: sshd -T
  become: true
  register: firewall_sshd
  changed_when: false
  check_mode: false

- name: Read what actually listens
  ansible.builtin.command: ss -Hltn
  register: firewall_listeners
  changed_when: false
  check_mode: false

# Not a loop: with no port found, a looped assert would pass without running.
- name: Refuse to filter SSH on a guessed port
  ansible.builtin.assert:
    that:
      - firewall_ssh_ports | length > 0
      - >-
        ansible_connection | default('ssh') == 'local'
        or (ansible_port | default(22) | string) in firewall_ssh_ports
      - >-
        firewall_ssh_ports | difference(firewall_listeners.stdout
        | regex_findall(':([0-9]+)\\s')) | length == 0
    fail_msg: >-
      sshd -T, the inventory and the listening sockets disagree on the SSH port of
      {{ inventory_hostname }}; enabling the firewall could lock everyone out.
    quiet: true

# SSH from the trusted sources only (wg1 is allowed wholesale further down). The
# specific rules go in BEFORE the any-source rule is removed, so a running session —
# including this play's own — is never cut.
- name: Allow SSH from the trusted sources
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.0 }}"
    port: "{{ item.1 }}"
    proto: tcp
  loop: "{{ ssh_allowed_sources | product(firewall_ssh_ports) | list }}"
  become: true

- name: Remove the any-source SSH rule (or keep it where it is the tracked exception)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    delete: "{{ not firewall_ssh_from_anywhere }}"
  loop: "{{ firewall_ssh_ports }}"
  become: true

- name: Allow WireGuard overlay port
  community.general.ufw:
    rule: allow
    port: "51821"
    proto: udp
  become: true

- name: Allow all inbound on wg1 overlay interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: wg1
  become: true

- name: Edge — allow HTTP/HTTPS from anywhere (public ingress)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["80", "443"]
  become: true
  when: "'edge' in group_names"

- name: Default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny
  become: true

- name: Default allow outgoing
  community.general.ufw:
    direction: outgoing
    policy: allow
  become: true

# Nothing here routes between networks on purpose (the mesh is direct, Docker manages
# its own FORWARD rules ahead of ufw's). node1 had drifted to "allow (routed)".
- name: Default deny routed
  community.general.ufw:
    direction: routed
    policy: deny
  become: true

- name: Enable ufw
  community.general.ufw:
    state: enabled
  become: true

# The rules the kernel enforces, not the ones ufw was asked for.
- name: Read the live input rules
  ansible.builtin.shell:
    cmd: |
      iptables -w -S INPUT
      iptables -w -S ufw-user-input
    executable: /bin/bash
  register: firewall_live
  changed_when: false
  become: true
  when: not ansible_check_mode

- name: Assert default deny and the intended SSH scope
  ansible.builtin.assert:
    that:
      - "'-P INPUT DROP' in firewall_live.stdout_lines"
      - >-
        ('-A ufw-user-input -s ' ~ item.0 ~ ' -p tcp -m tcp --dport ' ~ item.1 ~ ' -j ACCEPT')
        in firewall_live.stdout_lines
      - >-
        (('-A ufw-user-input -p tcp -m tcp --dport ' ~ item.1 ~ ' -j ACCEPT')
        in firewall_live.stdout_lines) == firewall_ssh_from_anywhere
    fail_msg: "ufw does not enforce the intended SSH scope on {{ inventory_hostname }}"
    quiet: true
  loop: "{{ ssh_allowed_sources | product(firewall_ssh_ports) | list }}"
  when: not ansible_check_mode

# --- Overlay guard -----------------------------------------------------------------
- name: Install the overlay guard script
  ansible.builtin.template:
    src: homelab-overlay-guard.sh.j2
    dest: /usr/local/sbin/homelab-overlay-guard
    mode: "0755"
  become: true
  notify: restart overlay guard

- name: Install the overlay guard unit
  ansible.builtin.copy:
    src: homelab-overlay-guard.service
    dest: /etc/systemd/system/homelab-overlay-guard.service
    mode: "0644"
  become: true
  notify: restart overlay guard

- name: Enable and start the overlay guard
  ansible.builtin.systemd:
    name: homelab-overlay-guard
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: not ansible_check_mode

- name: Apply a pending guard restart before verifying
  ansible.builtin.meta: flush_handlers

# Verify the effective state, not the files we wrote.
- name: Read the live raw-table rules and routes
  ansible.builtin.shell:
    cmd: |
      iptables -w -t raw -S PREROUTING
      iptables -w -t raw -S HOMELAB-OVERLAY-GUARD
      ip route show type unreachable
    executable: /bin/bash
  register: overlay_guard_live
  changed_when: false
  become: true
  when: not ansible_check_mode

- name: Assert the overlay guard is live
  ansible.builtin.assert:
    that:
      - "('-A PREROUTING -d ' ~ overlay_guard_cidr ~ ' -j HOMELAB-OVERLAY-GUARD') in overlay_guard_live.stdout"
      - "'-A HOMELAB-OVERLAY-GUARD -i wg1 -j RETURN' in overlay_guard_live.stdout"
      - "'-A HOMELAB-OVERLAY-GUARD -j DROP' in overlay_guard_live.stdout"
      - "('unreachable ' ~ overlay_guard_cidr) in overlay_guard_live.stdout"
    fail_msg: "overlay guard is NOT active on {{ inventory_hostname }}"
    success_msg: "overlay guard active on {{ inventory_hostname }}"
  when: not ansible_check_mode
