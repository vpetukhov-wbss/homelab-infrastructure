---
- name: Install Fail2Ban
  ansible.builtin.apt:
    name: fail2ban
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# Do not take the port from inventory: the laptop connects locally and carries no
# ansible_port, which would silently yield 22 while sshd actually listens on 2345 —
# a jail that loads cleanly and never matches anything. Ask sshd what it is using.
- name: Detect the port sshd actually listens on
  ansible.builtin.shell:
    cmd: "sshd -T 2>/dev/null | awk '/^port /{print $2}' | head -1"
    executable: /bin/bash
  become: true
  register: f2b_sshd_port
  changed_when: false

- name: Fail if the sshd port could not be determined
  ansible.builtin.assert:
    that: f2b_sshd_port.stdout | trim | length > 0
    fail_msg: "Could not read the sshd port on {{ inventory_hostname }}; refusing to guess."

- name: Template jail.local
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0644"
    validate: "sh -c 'test -s %s'"
  become: true
  notify: restart fail2ban

- name: Enable and start Fail2Ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  become: true

- name: Apply any pending restart before verifying
  ansible.builtin.meta: flush_handlers

# A jail that loaded but matches nothing is indistinguishable from no jail at all,
# so confirm the sshd jail is actually active rather than trusting the service state.
- name: Verify the sshd jail is active
  ansible.builtin.command:
    cmd: fail2ban-client status sshd
  become: true
  register: f2b_status
  changed_when: false
  retries: 5
  delay: 3
  until: f2b_status.rc == 0

# The overlay and the controller must be exempt; the (hostile) LAN as a whole must not.
- name: Confirm the overlay and the controller are exempt, the LAN is not
  ansible.builtin.command:
    cmd: fail2ban-client get sshd ignoreip
  become: true
  register: f2b_ignore
  changed_when: false
  failed_when: >-
    (wg_overlay_cidr | default('10.44.0.0/24')) not in f2b_ignore.stdout
    or (controller_lan_ip is defined and controller_lan_ip not in f2b_ignore.stdout)
    or lan_cidr in f2b_ignore.stdout

- name: Report jail state
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }}: {{ f2b_status.stdout_lines | select('search', 'Currently banned|Total banned|Currently failed') | list }}"
