---
# Gitea + Actions runner on the app/replica node. Both listeners bind the overlay.
- name: Create stack + data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ stack_dir }}"
    - "{{ stack_dir }}/gitea-data"
    - "{{ stack_dir }}/runner-data"

- name: Template Gitea + runner compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ stack_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start Gitea (first, so a runner token can be generated)
  ansible.builtin.command:
    cmd: docker compose up -d gitea
    chdir: "{{ stack_dir }}"
  register: gitea_up
  changed_when: "'Started' in gitea_up.stderr or 'Created' in gitea_up.stderr"

- name: Wait for Gitea HTTP to come up
  ansible.builtin.uri:
    url: "http://{{ wg_overlay_ip }}:{{ gitea_http_port }}/api/healthz"
    status_code: 200
  register: gitea_health
  until: gitea_health.status == 200
  retries: 30
  delay: 5

- name: Check whether the runner is already registered
  ansible.builtin.stat:
    path: "{{ stack_dir }}/runner-data/.runner"
  register: runner_registered

- name: Generate a runner registration token (Gitea CLI)
  ansible.builtin.command:
    # -u git: docker exec lands as root, and Gitea refuses to run as root
    # ("Gitea is not supposed to be run as root"), so the CLI must drop to its own user.
    cmd: docker exec -u git gitea gitea --work-path /data actions generate-runner-token
  register: runner_token
  changed_when: false
  when: not runner_registered.stat.exists

- name: Register the act_runner (one-time)
  ansible.builtin.command:
    # Two non-obvious requirements here.
    # -w /data: `register` writes its .runner credential file into the CURRENT
    # directory, not into /data. Without this the command reports success, writes
    # nothing the daemon can find, and act_runner then loops on "token is empty".
    # --entrypoint act_runner is required: the image's default entrypoint is
    # `/sbin/tini -- run.sh`, a wrapper that configures itself from environment
    # variables and ignores CLI flags entirely. Passing --instance to it produces
    # "instance address is empty" and an endless retry loop.
    cmd: >
      docker run --rm
      --entrypoint act_runner
      -w /data
      -v {{ stack_dir }}/runner-data:/data
      gitea/act_runner:latest
      register --no-interactive
      --instance http://{{ wg_overlay_ip }}:{{ gitea_http_port }}
      --token {{ runner_token.stdout | trim }}
      --name {{ inventory_hostname }}-runner
      --labels ubuntu-latest:docker://node:20-bookworm,homelab:host
  when: not runner_registered.stat.exists
  no_log: true

- name: Start the act_runner
  ansible.builtin.command:
    cmd: docker compose up -d act_runner
    chdir: "{{ stack_dir }}"
  register: runner_up
  changed_when: "'Started' in runner_up.stderr or 'Created' in runner_up.stderr"
