---
# Backups live on the edge node: a third machine, so losing either data node does not
# take the backups with it. Never put them on the node holding the data they protect.
backup_dir: "/home/{{ ansible_user }}/backups"
backup_secrets_dir: /etc/homelab
backup_db_name: homelab
# How many encrypted archives to keep. At one run a day this is three weeks.
backup_keep: 21
backup_on_calendar: "daily"
# Candidate data nodes; the script probes these to find whichever is primary NOW.
backup_pg_candidates:
  - "{{ hostvars['node2'].wg_overlay_ip }}"
  - "{{ hostvars['node3-data'].wg_overlay_ip }}"

# node3 snapshots its own SQLite databases and Gitea into an exports directory (the
# node_exports role); this job only PULLS them, over the rrsync-confined sync account.
# The same channel carries an off-node copy of every archive to node3's disk.
backup_sync_host: node3-data
backup_sync_user: homelab-sync
backup_sync_key: /etc/lsyncd/id_sftp_mirror
# Older exports mean node3's export timer failed: the run still archives everything
# else, then exits non-zero so the failure shows in `systemctl --failed`.
backup_exports_max_age_hours: 6

# Local to this node and otherwise unprotected: the mirror propagates deletes.
backup_sftp_dir: "/home/{{ ansible_user }}/stacks/edge/sftp_data"

# MongoDB is dumped over the overlay once its backup account has a password in the vault.
backup_mongodb_enabled: "{{ vault_mongodb_backup_password is defined }}"
backup_mongodb_host: "{{ hostvars[groups['controller'][0]].wg_overlay_ip }}"
backup_mongodb_port: 27017
