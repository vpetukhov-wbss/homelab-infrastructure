---
- name: Require the private ingest endpoint
  ansible.builtin.assert:
    that:
      - >-
        pulse_agent_ingest_url is
        match('^https?://[^/]+/internal/v1/telemetry$')
    fail_msg: >-
      Configure the private HomeLab Pulse ingest URL in the inventory.

- name: Require a per-host ingest credential
  ansible.builtin.assert:
    that:
      - vault_pulse_agent_ingest_token is defined
      - vault_pulse_agent_ingest_token | default('') | length > 0
  no_log: true

- name: Create the agent system group
  ansible.builtin.group:
    name: pulse-agent
    system: true

- name: Create the agent system account
  ansible.builtin.user:
    name: pulse-agent
    group: pulse-agent
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Create owned package and configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/pulse-agent/pulse_agent
    - /etc/pulse-agent

- name: Install the Python package source
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../apps/homelab-pulse/agent/src/pulse_agent/"
    dest: /opt/pulse-agent/pulse_agent/
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Install the per-host ingest token
  ansible.builtin.copy:
    content: "{{ vault_pulse_agent_ingest_token }}"
    dest: /etc/pulse-agent/ingest-token
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Configure the local SMART producer
  ansible.builtin.import_tasks: smart.yml

- name: Configure the local Docker producer
  ansible.builtin.import_tasks: docker.yml

- name: Require a dedicated Redis monitoring credential
  ansible.builtin.assert:
    that:
      - vault_pulse_agent_redis_password is defined
      - vault_pulse_agent_redis_password | default('') | length > 0
  when: pulse_agent_redis_host | length > 0
  no_log: true

- name: Install the Redis monitoring credential
  ansible.builtin.copy:
    content: "{{ vault_pulse_agent_redis_password }}"
    dest: /etc/pulse-agent/redis-password
    owner: root
    group: root
    mode: "0600"
  when: pulse_agent_redis_host | length > 0
  no_log: true

- name: Remove an unused Redis monitoring credential
  ansible.builtin.file:
    path: /etc/pulse-agent/redis-password
    state: absent
  when: pulse_agent_redis_host | length == 0

- name: Configure the PostgreSQL probe
  when: pulse_agent_postgres_host | length > 0
  block:
    - name: Require a private libpq password file
      ansible.builtin.assert:
        that:
          - vault_pulse_agent_postgres_pgpass is defined
          - vault_pulse_agent_postgres_pgpass | default('') | length > 0
      no_log: true

    - name: Install the PostgreSQL client
      ansible.builtin.apt:
        name: postgresql-client
        state: present

    - name: Install the PostgreSQL monitoring credential
      ansible.builtin.copy:
        content: "{{ vault_pulse_agent_postgres_pgpass }}"
        dest: /etc/pulse-agent/postgres-pgpass
        owner: root
        group: root
        mode: "0600"
      no_log: true

- name: Remove an unused PostgreSQL monitoring credential
  ansible.builtin.file:
    path: /etc/pulse-agent/postgres-pgpass
    state: absent
  when: pulse_agent_postgres_host | length == 0

- name: Configure the RabbitMQ probe
  when: pulse_agent_rabbitmq_host | length > 0
  block:
    - name: Require an approved RabbitMQ queue and monitoring credential
      ansible.builtin.assert:
        that:
          - pulse_agent_rabbitmq_queue | length > 0
          - vault_pulse_agent_rabbitmq_password | default('') | length > 0
      no_log: true

    - name: Install the RabbitMQ monitoring credential
      ansible.builtin.copy:
        content: "{{ vault_pulse_agent_rabbitmq_password }}"
        dest: /etc/pulse-agent/rabbitmq-password
        owner: root
        group: root
        mode: "0600"
      no_log: true

- name: Remove an unused RabbitMQ monitoring credential
  ansible.builtin.file:
    path: /etc/pulse-agent/rabbitmq-password
    state: absent
  when: pulse_agent_rabbitmq_host | length == 0

- name: Render approved metrics and private endpoint
  ansible.builtin.template:
    src: agent.ini.j2
    dest: /etc/pulse-agent/agent.ini
    owner: root
    group: root
    mode: "0644"

- name: Install agent units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - pulse-agent.service
    - pulse-agent.timer
  notify: Restart pulse-agent timer

- name: Start the timer
  ansible.builtin.systemd_service:
    name: pulse-agent.timer
    daemon_reload: true
    enabled: true
    state: started

- name: Read effective timer state
  ansible.builtin.command:
    argv: [systemctl, is-active, pulse-agent.timer]
  changed_when: false
  when: not ansible_check_mode
