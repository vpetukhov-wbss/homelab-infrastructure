---
# node1 -> node3 SFTP mirror with lsyncd (inotify + rsync over SSH on the wg1 overlay).
# node1 stays authoritative; node3 keeps a warm copy on the biggest disk in the fleet.
#
# Trust model: a DEDICATED keypair, generated on node1. On node3 it is accepted only
# from node1's overlay IP, only for the unprivileged {{ mirror_sync_user }} account, and
# only as `rrsync {{ mirror_sync_data }}` — no shell, no forwarding. The account and its
# directories come from the node_exports role (run it on the target first).

- name: Install lsyncd and rsync
  ansible.builtin.apt:
    name:
      - lsyncd
      - rsync
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Ensure the lsyncd config and log directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - /etc/lsyncd
    - "{{ mirror_log_dir }}"
  become: true

# uid/gid 1001 is the sftp container's "homelab" user (see the edge role's compose).
- name: Ensure the SFTP source directory exists, owned by the sftp container uid
  ansible.builtin.file:
    path: "{{ sftp_data_dir }}"
    state: directory
    owner: "1001"
    group: "1001"
    mode: "0755"
  become: true

- name: Generate the dedicated lsyncd SSH key (once)
  community.crypto.openssh_keypair:
    path: "{{ mirror_key_path }}"
    type: ed25519
    comment: "lsyncd sftp-mirror {{ inventory_hostname }}->{{ mirror_target_host }}"
    mode: "0600"
  become: true
  register: mirror_key

# Root-owned and outside the rrsync root, so the key cannot rewrite its own restrictions.
- name: Authorize the key on the target — rrsync only, from this node's overlay IP
  ansible.builtin.copy:
    dest: "{{ mirror_sync_root }}/.ssh/authorized_keys"
    content: |
      # Managed by Ansible (homelab) — {{ inventory_hostname }} lsyncd + backup
      restrict,from="{{ wg_overlay_ip }}",command="/usr/bin/rrsync {{ mirror_sync_data }}" {{ mirror_key.public_key }}
    owner: root
    group: root
    mode: "0644"
  become: true
  delegate_to: "{{ mirror_target_host }}"

# lsyncd runs as root, and the ssh options it hands to rsync do not reliably carry
# StrictHostKeyChecking through. If root does not already trust the target's host key,
# every sync dies with "Host key verification failed" — so seed it explicitly.
- name: Seed root's known_hosts with the mirror target host key
  ansible.builtin.shell:
    cmd: |
      set -e
      mkdir -p /root/.ssh && chmod 700 /root/.ssh
      touch /root/.ssh/known_hosts && chmod 600 /root/.ssh/known_hosts
      TARGET={{ hostvars[mirror_target_host].wg_overlay_ip }}
      if ssh-keygen -F "$TARGET" -f /root/.ssh/known_hosts >/dev/null 2>&1; then
        echo "already trusted"
      else
        ssh-keyscan -t ed25519,rsa -p {{ mirror_target_ssh_port }} "$TARGET" >> /root/.ssh/known_hosts
        echo "seeded"
      fi
    executable: /bin/bash
  register: mirror_known_hosts
  changed_when: "'seeded' in mirror_known_hosts.stdout"
  become: true

- name: Template the lsyncd configuration
  ansible.builtin.template:
    src: lsyncd.conf.lua.j2
    dest: /etc/lsyncd/lsyncd.conf.lua
    mode: "0640"
  become: true
  notify: restart lsyncd

- name: Enable and start lsyncd
  ansible.builtin.systemd:
    name: lsyncd
    enabled: true
    state: started
    daemon_reload: true
  become: true

- name: Flush handlers so the verification below tests the current config
  ansible.builtin.meta: flush_handlers

# --- verification -------------------------------------------------------------
- name: The key must NOT be able to run a shell command on the target
  ansible.builtin.command:
    cmd: >
      ssh -i {{ mirror_key_path }} -o BatchMode=yes -o StrictHostKeyChecking=yes
      {{ mirror_sync_user }}@{{ hostvars[mirror_target_host].wg_overlay_ip }} id
  register: mirror_shell_probe
  changed_when: false
  failed_when: mirror_shell_probe.rc == 0 or 'uid=' in mirror_shell_probe.stdout
  become: true

- name: Drop a canary file into the SFTP tree
  ansible.builtin.copy:
    content: "lsyncd mirror canary {{ ansible_date_time.iso8601 }}\n"
    dest: "{{ sftp_data_dir }}/.mirror-canary"
    owner: "1001"
    group: "1001"
    mode: "0644"
  become: true

- name: Wait for the canary to land on the replica
  ansible.builtin.command:
    cmd: cat {{ mirror_sync_data }}/{{ mirror_target_subdir }}/.mirror-canary
  register: canary
  until: canary.rc == 0 and ansible_date_time.iso8601 in canary.stdout
  retries: 12
  delay: 5
  changed_when: false
  become: true
  delegate_to: "{{ mirror_target_host }}"

- name: Report mirror status
  ansible.builtin.debug:
    msg: >-
      SFTP mirror live: {{ sftp_data_dir }} on {{ inventory_hostname }}
      -> {{ mirror_sync_user }}@{{ hostvars[mirror_target_host].wg_overlay_ip }}:{{ mirror_target_subdir }}
      (rrsync-confined; shell access refused: {{ (mirror_shell_probe.stderr | default('') | trim)[:80] }})
